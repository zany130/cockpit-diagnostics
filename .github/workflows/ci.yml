name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y make git gettext

      - name: Install dependencies and build
        run: make

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run eslint

      - name: Stylelint
        run: npm run stylelint

      - name: Vitest
        run: npm test

      - name: Production build
        run: NODE_ENV=production ./build.js

  packaging:
    name: RPM spec and package
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Allow git in the container workdir
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install RPM tooling
        run: dnf install -y make git rpm-build nodejs npm gettext libappstream-glib findutils python3

      - name: Build RPM
        run: make rpm

      - name: Inspect package
        run: |
          set -eux
          rpm -qip cockpit-diagnostics-*.noarch.rpm
          rpm -qp --requires cockpit-diagnostics-*.noarch.rpm
          rpm -qlp cockpit-diagnostics-*.noarch.rpm
          rpm -qlp cockpit-diagnostics-*.noarch.rpm | grep -F /usr/share/cockpit/diagnostics/
          if rpm -qlp cockpit-diagnostics-*.noarch.rpm | grep -E 'node_modules|test/fixtures|preview/'; then
            echo "RPM contains development files" >&2
            exit 1
          fi
